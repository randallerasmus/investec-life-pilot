spring.application.name=lifepilot
server.port=8080

investec.base-url=https://openapi.investec.com
investec.client-id=${INVESTEC_CLIENT_ID:}
investec.client-secret=${INVESTEC_CLIENT_SECRET:}
investec.api-key=${INVESTEC_API_KEY:}

openai.base-url=https://api.openai.com/v1
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:}

# Programmable card guardrail. Monitor mode reports the verdict without ever
# declining; turn it off only once the verdicts look right for a real account.
lifepilot.card.monitor-only=${LIFEPILOT_CARD_MONITOR_ONLY:true}
lifepilot.card.emergency-buffer=${LIFEPILOT_CARD_EMERGENCY_BUFFER:500.00}
lifepilot.card.snapshot-ttl-seconds=${LIFEPILOT_CARD_SNAPSHOT_TTL_SECONDS:300}
# Blank disables the card endpoints. They face the internet and answer with balances.
lifepilot.card.shared-secret=${LIFEPILOT_CARD_SHARED_SECRET:}
